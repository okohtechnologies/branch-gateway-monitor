name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ipmon
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ipmon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipmon -d ipmon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ipmon:ci-only-password@localhost:5432/ipmon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The probe tests send real ICMP; allow unprivileged ICMP sockets on the runner.
      - name: Allow unprivileged ICMP
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --cov=ipmon --cov-fail-under=85

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ipmon:ci .
